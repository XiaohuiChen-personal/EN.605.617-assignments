# Course assignment runner (assignment_build_execution).
# This file stays at the repository root. `folder` names the assignment
# the runner builds. Earlier moduleN/ directories stay in the tree.
# folder is relative to this file and must contain build.sh / run.sh.
folder: module12

# ./build.sh → assignment.exe
build: {}

# count, start, dim, wg, vec, target, map
run:
  - [65536, 0, 256, 64, 4, 17, 0]      # float4, copy
  - [1, 10, 256, 64, 4, 0, 0]          # one word, sub-buffer not at byte 0
  - [65536, 32, 256, 128, 1, 17, 0]    # scalar loads, different group size
  - [65536, 0, 256, 32, 8, 3, 1]       # float8, map the result
  - [65536, 64, 256, 256, 4, 100, 0]   # longer origin, work-group at the limit
