# Course assignment runner (assignment_build_execution).
# This file stays at the repository root. `folder` names the assignment
# the runner builds. module3/ is the previous submission and stays in
# the tree; switch `folder` back to module3 to rebuild that one.
# folder is relative to this file and must contain build.sh / run.sh.
folder: module5

# `make` with no arguments → assignment.exe
build: {}

# total threads, threads per block. Block count is threads/block.
# These five runs change the thread count and the block size.
run:
  - [512, 256]
  - [65536, 256]
  - [1048576, 256]
  - [1048576, 128]
  - [1048576, 64]
