# Course assignment runner (assignment_build_execution).
# This file stays at the repository root. `folder` names the assignment
# the runner builds. Earlier moduleN/ directories stay in the tree.
# folder is relative to this file and must contain build.sh / run.sh.
folder: module6

# `make` with no arguments → assignment.exe
build: {}

# N (elements in each of the two arrays), threads per block.
# The four runs change the dataset length. The kernel does not.
run:
  - [262144, 256]
  - [1048576, 256]
  - [4194304, 256]
  - [16777216, 256]
